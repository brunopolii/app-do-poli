name: Sync Kiwify licenses

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kiwify-license-sync.yml'
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read

env:
  FORCE_SYNC_TEST: "1"
  APK_DOWNLOAD_URL: "https://github.com/brunopolii/app-do-poli/releases/latest/download/app-release.apk"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Wrangler
        run: npm install --global wrangler@latest

      - name: Authenticate with Kiwify
        env:
          KIWIFY_CLIENT_ID: ${{ secrets.KIWIFY_CLIENT_ID }}
          KIWIFY_CLIENT_SECRET: ${{ secrets.KIWIFY_CLIENT_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          token_json=$(curl -fsS --max-time 30 \
            -X POST 'https://public-api.kiwify.com/v1/oauth/token' \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode "client_id=$KIWIFY_CLIENT_ID" \
            --data-urlencode "client_secret=$KIWIFY_CLIENT_SECRET")
          token=$(echo "$token_json" | jq -r '.access_token // empty')
          test -n "$token"
          printf '%s' "$token" > /tmp/kiwify_token
          echo 'Kiwify OAuth authentication succeeded.'

      - name: Find Polirotinas product
        id: product
        env:
          KIWIFY_ACCOUNT_ID: ${{ secrets.KIWIFY_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          token=$(cat /tmp/kiwify_token)
          products=$(curl -fsS --max-time 30 \
            -H "Authorization: Bearer $token" \
            -H "x-kiwify-account-id: $KIWIFY_ACCOUNT_ID" \
            'https://public-api.kiwify.com/v1/products?page_size=100&page_number=1')
          product_id=$(echo "$products" | jq -r '.data[] | select(.name == "Polirotinas") | .id' | head -n1)
          test -n "$product_id"
          echo "product_id=$product_id" >> "$GITHUB_OUTPUT"
          echo 'Polirotinas product found.'

      - name: Download recent sales
        env:
          KIWIFY_ACCOUNT_ID: ${{ secrets.KIWIFY_ACCOUNT_ID }}
          PRODUCT_ID: ${{ steps.product.outputs.product_id }}
        shell: bash
        run: |
          set -euo pipefail
          token=$(cat /tmp/kiwify_token)
          start_date=$(date -u -d '89 days ago' +%Y-%m-%d)
          end_date=$(date -u +%Y-%m-%d)
          : > /tmp/sales.jsonl
          for page in $(seq 1 10); do
            response=$(curl -fsS --max-time 30 \
              -G 'https://public-api.kiwify.com/v1/sales' \
              -H "Authorization: Bearer $token" \
              -H "x-kiwify-account-id: $KIWIFY_ACCOUNT_ID" \
              --data-urlencode "start_date=$start_date" \
              --data-urlencode "end_date=$end_date" \
              --data-urlencode "product_id=$PRODUCT_ID" \
              --data-urlencode 'page_size=100' \
              --data-urlencode "page_number=$page" \
              --data-urlencode 'view_full_sale_details=true')
            count=$(echo "$response" | jq '.data | length')
            echo "$response" | jq -c '.data[]' >> /tmp/sales.jsonl
            if [ "$count" -lt 100 ]; then break; fi
          done
          echo "Downloaded $(wc -l < /tmp/sales.jsonl) Polirotinas sales records."

      - name: Build D1 synchronization SQL
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, secrets
          from pathlib import Path
          alphabet = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"
          def key():
              raw = ''.join(secrets.choice(alphabet) for _ in range(12))
              return f"POLI-{raw[:4]}-{raw[4:8]}-{raw[8:12]}"
          def q(value):
              if value is None: return "NULL"
              return "'" + str(value).replace("'", "''") + "'"
          statements=[]; seen=set()
          for line in Path('/tmp/sales.jsonl').read_text().splitlines():
              if not line.strip(): continue
              sale=json.loads(line)
              transaction_id=str(sale.get('id') or '').strip()
              if not transaction_id or transaction_id in seen: continue
              seen.add(transaction_id)
              customer=sale.get('customer') or {}
              email=str(customer.get('email') or '').strip().lower()
              name=str(customer.get('name') or '').strip()
              status=str(sale.get('status') or '').lower()
              if status in {'paid','approved'}:
                  statements.append("INSERT INTO licenses (license_key, transaction_id, buyer_email, buyer_name, status, created_at) VALUES (%s, %s, %s, %s, 'active', datetime('now')) ON CONFLICT(transaction_id) DO UPDATE SET buyer_email=excluded.buyer_email, buyer_name=excluded.buyer_name, status='active', revoked_at=NULL;" % (q(key()),q(transaction_id),q(email),q(name)))
              elif status in {'refunded','chargedback','pending_refund','refund_requested'}:
                  statements.append(f"UPDATE licenses SET status='revoked', revoked_at=datetime('now') WHERE transaction_id={q(transaction_id)};")
          Path('/tmp/sync.sql').write_text('\n'.join(statements)+('\n' if statements else ''))
          print(f'Generated {len(statements)} D1 statements.')
          PY

      - name: Ensure D1 schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: backend/license-worker
        shell: bash
        run: |
          set -euo pipefail
          wrangler d1 execute polirotinas-licenses --remote --file=schema.sql
          echo 'D1 schema is ready.'

      - name: Generate test license
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: backend/license-worker
        shell: bash
        run: |
          set -euo pipefail
          TEST_TRANSACTION_ID='POLIROTINAS-INTERNAL-TEST'
          TEST_LICENSE_KEY='POLI-TEST-APK133-2026'
          wrangler d1 execute polirotinas-licenses --remote --command "INSERT INTO licenses (license_key, transaction_id, buyer_email, buyer_name, status, created_at) VALUES ('$TEST_LICENSE_KEY','$TEST_TRANSACTION_ID','teste@polirotinas.local','Teste Polirotinas','active',datetime('now')) ON CONFLICT(transaction_id) DO UPDATE SET license_key=excluded.license_key, status='active', revoked_at=NULL;"
          echo "TEST_LICENSE_KEY=$TEST_LICENSE_KEY"
          echo "TEST_LICENSE_KEY=$TEST_LICENSE_KEY" >> "$GITHUB_ENV"
          echo 'Internal test license is active.'

      - name: Apply licenses to D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: backend/license-worker
        run: |
          set -euo pipefail
          if [ -s /tmp/sync.sql ]; then
            wrangler d1 execute polirotinas-licenses --remote --file=/tmp/sync.sql
          else
            echo 'No license changes to apply.'
          fi

      - name: Verify D1 population
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: backend/license-worker
        shell: bash
        run: |
          set -euo pipefail
          result=$(wrangler d1 execute polirotinas-licenses --remote --command "SELECT COUNT(*) AS total, SUM(CASE WHEN status='active' THEN 1 ELSE 0 END) AS active FROM licenses" --json)
          echo "$result" | jq -r '.[0].results[0] | "D1 licenses total=\(.total) active=\(.active // 0)"'
          total=$(echo "$result" | jq -r '.[0].results[0].total // 0')
          test "$total" -gt 0
          echo 'D1 verification passed.'

      - name: Deliver new licenses by email
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
        working-directory: backend/license-worker
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${RESEND_API_KEY:-}" ] || [ -z "${RESEND_FROM_EMAIL:-}" ]; then
            echo 'Email delivery is not configured yet. Add RESEND_API_KEY and RESEND_FROM_EMAIL to GitHub Secrets.'
            exit 0
          fi

          licenses=$(wrangler d1 execute polirotinas-licenses --remote --command "SELECT l.transaction_id, l.license_key, l.buyer_email, COALESCE(l.buyer_name,'Cliente') AS buyer_name FROM licenses l LEFT JOIN license_deliveries d ON d.transaction_id=l.transaction_id WHERE l.status='active' AND l.buyer_email IS NOT NULL AND l.buyer_email != '' AND l.buyer_email NOT LIKE '%@polirotinas.local' AND d.transaction_id IS NULL" --json)

          echo "$licenses" | jq -c '.[0].results[]?' | while IFS= read -r row; do
            email=$(echo "$row" | jq -r '.buyer_email')
            name=$(echo "$row" | jq -r '.buyer_name')
            transaction_id=$(echo "$row" | jq -r '.transaction_id')
            license_key=$(echo "$row" | jq -r '.license_key')

            payload=$(jq -n \
              --arg from "$RESEND_FROM_EMAIL" \
              --arg to "$email" \
              --arg name "$name" \
              --arg license "$license_key" \
              --arg apk "$APK_DOWNLOAD_URL" \
              '{from:$from,to:[$to],subject:"Seu acesso ao Polirotinas",html:("<h2>Compra aprovada! 🎉</h2><p>Olá, " + $name + "!</p><p>Obrigado por adquirir o <strong>Polirotinas</strong>.</p><p><strong>Seu código de ativação:</strong></p><p style=\"font-size:22px;font-weight:bold;letter-spacing:1px\">" + $license + "</p><p><a href=\"" + $apk + "\">Baixar o aplicativo Polirotinas para Android</a></p><p>Instale o aplicativo, abra a tela de ativação e informe o código acima.</p><p>Guarde este e-mail para futuras reinstalações.</p>") }')

            response=$(curl -fsS --max-time 30 \
              -X POST 'https://api.resend.com/emails' \
              -H "Authorization: Bearer $RESEND_API_KEY" \
              -H 'Content-Type: application/json' \
              --data "$payload")

            email_id=$(echo "$response" | jq -r '.id // empty')
            test -n "$email_id"

            wrangler d1 execute polirotinas-licenses --remote --command "INSERT INTO license_deliveries (transaction_id,email,license_key,sent_at) VALUES ('$transaction_id','$email','$license_key',datetime('now'));"
            echo "License delivered to $email. Resend ID: $email_id"
          done

      - name: Show test license for manual activation
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          echo "=========================================="
          echo "POLIROTINAS TEST LICENSE: $TEST_LICENSE_KEY"
          echo "=========================================="
