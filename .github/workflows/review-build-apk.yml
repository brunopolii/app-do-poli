
name: Build Android APK (Poliroutines Review)

on:
  workflow_dispatch:
  push:
    branches:
      - codex/poliroutines-complete-review-2026-10-10

permissions:
  contents: write

# Compartilha o bloqueio com o workflow oficial para evitar versionCode duplicado.
concurrency:
  group: poliroutines-apk-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Apply supported Dart fixes and persist source corrections
        shell: bash
        run: |
          set -euo pipefail
          dart fix --apply
          git add lib
          if ! git diff --cached --quiet; then
            if [[ "$GITHUB_REF_NAME" != codex/poliroutines-complete-review-* ]]; then
              echo "Há correções automáticas, mas a persistência automática só é permitida na branch isolada de revisão."
              exit 1
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "style: aplicar correções sugeridas pelo Dart"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

      - name: Calculate next Android versionCode
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_CODE="$(sed -n 's/^version: .*+\([0-9][0-9]*\)$/\1/p' pubspec.yaml | head -n 1)"
          if [ -z "$CURRENT_CODE" ]; then
            echo "Não foi possível encontrar o versionCode do pubspec.yaml."
            exit 1
          fi

          LATEST_APK="/tmp/Poliroutines-latest.apk"
          LATEST_CODE=""
          if curl -fL --retry 3 --retry-delay 2 \
              "https://github.com/brunopolii/app-do-poli/releases/latest/download/Poliroutines.apk" \
              -o "$LATEST_APK"; then
            AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1 || true)"
            if [ -n "$AAPT" ]; then
              LATEST_CODE="$("$AAPT" dump badging "$LATEST_APK" | sed -n "s/.*versionCode='\\([0-9][0-9]*\\)'.*/\\1/p" | head -n 1)"
            fi
          fi

          NEXT_CODE="$CURRENT_CODE"
          if [ -n "$LATEST_CODE" ]; then
            RELEASE_NEXT=$((LATEST_CODE + 1))
            if [ "$RELEASE_NEXT" -gt "$NEXT_CODE" ]; then
              NEXT_CODE="$RELEASE_NEXT"
            fi
          fi
          echo "versionCode atual no projeto: $CURRENT_CODE"
          echo "próximo versionCode do APK: $NEXT_CODE"
          echo "NEXT_VERSION_CODE=$NEXT_CODE" >> "$GITHUB_ENV"

      - name: Analyze (strict; zero issues required)
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Run Flutter tests when present
        shell: bash
        run: |
          set -euo pipefail
          if [ -d test ] && find test -type f -name '*_test.dart' -print -quit | grep -q .; then
            flutter test --no-pub
          else
            echo "Nenhum teste Flutter automatizado encontrado em test/."
          fi

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/poliroutines-release.keystore
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=poliroutines-release.keystore
          EOF

      - name: Build APK
        run: flutter build apk --release --build-number "$NEXT_VERSION_CODE"

      - name: Verify APK version and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          BADGING="$("$AAPT" dump badging "$APK")"
          echo "$BADGING" | grep -F "versionCode='$NEXT_VERSION_CODE'"
          echo "$BADGING" | grep -F "versionName='4.3.0'"
          "$APKSIGNER" verify --verbose "$APK"
          sha256sum "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: poliroutines-reviewed-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
