name: Deploy license worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/license-worker/**'
      - '.github/workflows/deploy-license-worker.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Wrangler
        run: npm install --global wrangler@latest

      - name: Migrate D1 schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: backend/license-worker
        shell: bash
        run: |
          set -euo pipefail
          add_column() {
            local name="$1" definition="$2"
            local info
            info=$(wrangler d1 execute polirotinas-licenses --remote --command "PRAGMA table_info(licenses)" --json || true)
            if echo "$info" | jq -e --arg n "$name" '.[0].results[]? | select(.name == $n)' >/dev/null 2>&1; then
              echo "Column $name already exists."
              return 0
            fi
            # Two deploys can overlap. A duplicate-column error simply means the
            # other deploy added it first; other Wrangler/API errors must still
            # fail the workflow.
            if ! wrangler d1 execute polirotinas-licenses --remote --command "ALTER TABLE licenses ADD COLUMN $name $definition"; then
              info=$(wrangler d1 execute polirotinas-licenses --remote --command "PRAGMA table_info(licenses)" --json)
              echo "$info" | jq -e --arg n "$name" '.[0].results[]? | select(.name == $n)' >/dev/null
            fi
          }
          add_column product_name 'TEXT'
          add_column license_type "TEXT NOT NULL DEFAULT 'lifetime'"
          add_column subscription_id 'TEXT'
          add_column last_payment_id 'TEXT'
          add_column expires_at 'TEXT'
          add_column cancelled_at 'TEXT'
          wrangler d1 execute polirotinas-licenses --remote --command "CREATE INDEX IF NOT EXISTS idx_licenses_transaction_id ON licenses(transaction_id); CREATE INDEX IF NOT EXISTS idx_licenses_status ON licenses(status); CREATE INDEX IF NOT EXISTS idx_licenses_subscription_id ON licenses(subscription_id); CREATE INDEX IF NOT EXISTS idx_licenses_expires_at ON licenses(expires_at); CREATE INDEX IF NOT EXISTS idx_license_deliveries_license_key ON license_deliveries(license_key);" || true

      - name: Ensure D1 schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: backend/license-worker
        run: wrangler d1 execute polirotinas-licenses --remote --file=schema.sql

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: backend/license-worker
        run: wrangler deploy

      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl -fsS --max-time 20 'https://polirotinas-license.brunopoli95.workers.dev/health')
          echo "$response"
          echo "$response" | jq -e '.ok == true and .service == "poliroutines-license" and .version == "5"' >/dev/null
