name: Deploy license worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'backend/license-worker/**'
      - '.github/workflows/deploy-license-worker.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply D1 schema
        working-directory: backend/license-worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: backend/license-worker
          command: d1 execute polirotinas-licenses --remote --file=./schema.sql

      - name: Deploy Worker
        working-directory: backend/license-worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: backend/license-worker
          command: deploy
