name: Deploy license worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'backend/license-worker/**'
      - '.github/workflows/deploy-license-worker.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply D1 schema
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: backend/license-worker
          command: d1 execute polirotinas-licenses --remote --file=./schema.sql

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: backend/license-worker
          command: deploy

      - name: Smoke test Worker
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            body=$(curl -fsS --max-time 15 https://polirotinas-license.brunopoli95.workers.dev/health || true)
            echo "$body"
            if echo "$body" | grep -q '"service":"polirotinas-license"'; then
              exit 0
            fi
            sleep 10
          done
          echo 'Worker did not expose the expected health response.'
          exit 1
